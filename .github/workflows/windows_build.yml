name: Build and Release Windows

on:
  push:
    branches: [ main ]
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    name: Build Windows x64 Executable
    runs-on: windows-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup MSVC environment
        uses: ilammy/msvc-dev-cmd@v1

      - name: Configure CMake
        run: cmake -B build -DCMAKE_BUILD_TYPE=Release

      - name: Build executable
        run: cmake --build build --config Release -j

      - name: Package game
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist/rogue_legacy
          $exe = (Get-ChildItem -Path build -Filter "rogue_legacy_cpp.exe" -Recurse | Select-Object -First 1)
          if (-not $exe) { throw "rogue_legacy_cpp.exe not found in build directory!" }
          Copy-Item $exe.FullName dist/rogue_legacy/rogue_legacy.exe
          Copy-Item README.md dist/rogue_legacy/
          Compress-Archive -Path dist/rogue_legacy/* -DestinationPath rogue_legacy_windows_x64.zip

      - name: Upload Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: rogue_legacy_windows_x64
          path: rogue_legacy_windows_x64.zip
          retention-days: 90

      - name: Publish Windows Release on GitHub
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/')
        with:
          tag_name: latest
          name: "Rogue Legacy C++ Latest Windows Build"
          body: |
            ### 🎮 Rogue Legacy C++ Windows Standalone Build
            Автоматична збірка для Windows x64.
            
            **Як запустити на Windows:**
            1. Завантажте `rogue_legacy_windows_x64.zip` нижче.
            2. Розархівуйте архів у будь-яку зручну папку.
            3. Запустіть `rogue_legacy.exe` подвійним кліком!
          files: rogue_legacy_windows_x64.zip
          prerelease: false
